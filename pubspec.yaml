name: flutter_plango
description: "PlanGo DZ - Algeria Travel Guide"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # ── UI & Icons ───────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ── Network & Links ──────────────────────────────────────
  url_launcher: ^6.2.0
  http: ^1.1.0

  # ── Internationalisation ──────────────────────────────────
  intl: ^0.19.0

  # ── PDF & Sharing ─────────────────────────────────────────
  pdf: ^3.10.7
  printing: ^5.12.0
  share_plus: ^7.2.1

  # ── Utilities ─────────────────────────────────────────────
  uuid: ^4.3.3
  flutter_dotenv: ^5.1.0

  # ── Firebase ──────────────────────────────────────────────
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.11
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/wilayas/
    - .env