name: flutter_plango
description: "PlanGo Dz - Algeria Travel Guide"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # UI Icons
  cupertino_icons: ^1.0.8
  
  # Location & Maps
  geolocator: ^10.1.0
  url_launcher: ^6.2.0
  
  # Video & Media
  video_player: ^2.8.0
  chewie: ^1.7.0
  
  # Networking
  http: ^1.1.0
  
  # Utilities
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/algeria.jpg